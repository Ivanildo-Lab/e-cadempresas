{% extends "base.html" %}
{% block content %}
<div class="box box-danger">
    <div class="box-header with-border"><h3 class="box-title">Confirmar Exclusão</h3></div>
    <div class="box-body">
        <p>Tem certeza que deseja excluir a empresa <b>{{ obj.razao_social }}</b>?</p>
        <p class="text-danger"><i class="fa fa-warning"></i> Esta ação não pode ser desfeita e removerá também todos os sócios vinculados.</p>
    </div>
    <div class="box-footer">
        <form method="post">{% csrf_token %}
            <button type="submit" class="btn btn-danger">Sim, Excluir</button>
            <a href="{% url 'empresa_list' %}" class="btn btn-default">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
